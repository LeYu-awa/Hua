openapi: 3.1.0
info:
  title: Floral Notepaper Agent Core API
  version: 0.1.0
  description: 本地核心版 Agent 模块标准化 API，用于 HTTP/WS 适配层、Tauri command 和独立模块测试对接。
servers:
  - url: http://localhost:1420/agent
    description: Local desktop adapter
paths:
  /events:
    post:
      summary: 采集并标准化事件
      operationId: collectEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawEvent'
      responses:
        '200':
          description: 标准化事件，若被过滤则返回 filtered=true
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StandardizedEvent'
                  - type: object
                    properties:
                      filtered:
                        type: boolean
                        const: true
    get:
      summary: 分页查询事件
      operationId: queryEvents
      parameters:
        - name: eventType
          in: query
          schema: { type: string }
        - name: sourceId
          in: query
          schema: { type: string }
        - name: start
          in: query
          schema: { type: string, format: date-time }
        - name: end
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: 标准化事件列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandardizedEvent'
  /canvas/index:
    post:
      summary: 增量更新画布节点索引
      operationId: updateCanvasIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanvasChange'
      responses:
        '204': { description: 已更新 }
    get:
      summary: 查询画布节点索引
      operationId: queryCanvasIndex
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: nodeType
          in: query
          schema: { type: string }
        - name: x
          in: query
          schema: { type: number }
        - name: y
          in: query
          schema: { type: number }
        - name: width
          in: query
          schema: { type: number }
        - name: height
          in: query
          schema: { type: number }
      responses:
        '200':
          description: 命中的画布节点索引
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CanvasNodeIndex'
  /embeddings:
    post:
      summary: 生成并缓存文本向量
      operationId: createEmbedding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                dimension: { type: integer, minimum: 1, default: 768 }
      responses:
        '200':
          description: 向量记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingRecord'
  /embeddings/search:
    post:
      summary: 向量相似度 Top-N 查询
      operationId: searchSimilarEmbeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vector]
              properties:
                vector:
                  type: array
                  items: { type: number }
                topN: { type: integer, minimum: 1, default: 5 }
      responses:
        '200':
          description: 相似文本结果
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimilarityResult'
  /rules/evaluate:
    post:
      summary: 执行规则匹配流水线
      operationId: evaluateRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/StandardizedEvent'
      responses:
        '200':
          description: 触发指令列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TriggerInstruction'
  /llm/invoke:
    post:
      summary: 组装 Prompt 并调用 LLM
      operationId: invokeLlm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmRequest'
      responses:
        '200':
          description: 标准化洞察
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredInsight'
  /insights/dispatch:
    post:
      summary: 分发结构化洞察到 UI、Live2D、回放库和复盘报告
      operationId: dispatchInsight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StructuredInsight'
      responses:
        '200':
          description: 各渠道转换后的 payload
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutedInsightPayload'
  /profiles/{userId}:
    get:
      summary: 查询用户画像
      operationId: getUserProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 用户画像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      summary: 新增或更新用户画像
      operationId: upsertUserProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [basicAttributes]
              properties:
                basicAttributes: { type: string }
                preferences:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: 用户画像
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /replay/markers:
    post:
      summary: 从事件和洞察生成回放关键帧
      operationId: generateReplayMarkers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events, insights]
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/StandardizedEvent'
                insights:
                  type: array
                  items:
                    $ref: '#/components/schemas/StructuredInsight'
                config:
                  $ref: '#/components/schemas/ReplayMarkerConfig'
      responses:
        '200':
          description: 回放关键帧列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReplayKeyframe'
  /live2d/signals:
    post:
      summary: 入队 Live2D 动作信号
      operationId: enqueueLive2DSignal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Live2DSignal'
      responses:
        '202': { description: 已入队 }
  /live2d/heartbeat:
    post:
      summary: 更新 Live2D 心跳状态
      operationId: heartbeatLive2D
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connected]
              properties:
                connected: { type: boolean }
      responses:
        '200':
          description: 当前连接和队列状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatStatus'
components:
  schemas:
    RawEvent:
      type: object
      required: [eventType, source, payload]
      properties:
        eventType: { type: string }
        timestamp: { type: string, format: date-time }
        source:
          $ref: '#/components/schemas/EventSource'
        payload: { type: object, additionalProperties: true }
    EventSource:
      type: object
      required: [sourceId, sourceAddress, protocol]
      properties:
        sourceId: { type: string }
        sourceAddress: { type: string }
        protocol:
          type: string
          enum: [http, webSocket, local]
    StandardizedEvent:
      type: object
      required: [eventId, eventType, timestamp, sourceId, sourceAddress, protocol, payload]
      properties:
        eventId: { type: string }
        eventType: { type: string }
        timestamp: { type: string, format: date-time }
        sourceId: { type: string }
        sourceAddress: { type: string }
        protocol: { type: string, enum: [http, webSocket, local] }
        payload: { type: object, additionalProperties: true }
    CanvasChange:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [upsert, delete] }
        node:
          $ref: '#/components/schemas/CanvasNodeInput'
        nodeId: { type: string }
    CanvasNodeInput:
      type: object
      required: [nodeId, nodeType, position]
      properties:
        nodeId: { type: string }
        nodeType: { type: string }
        position:
          $ref: '#/components/schemas/CanvasPosition'
        richText: { type: string }
        annotation: { type: string }
        note: { type: string }
        ocrText: { type: string }
        relations:
          type: array
          items:
            $ref: '#/components/schemas/CanvasRelation'
    CanvasNodeIndex:
      allOf:
        - $ref: '#/components/schemas/CanvasNodeInput'
        - type: object
          properties:
            text: { type: string }
            keywords:
              type: array
              items: { type: string }
            deleted: { type: boolean }
    CanvasPosition:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }
    CanvasRelation:
      type: object
      required: [targetNodeId, relationType]
      properties:
        targetNodeId: { type: string }
        relationType: { type: string }
    EmbeddingRecord:
      type: object
      properties:
        textHash: { type: string }
        text: { type: string }
        vector:
          type: array
          items: { type: number }
        dimension: { type: integer }
        provider: { type: string }
        expiresAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SimilarityResult:
      type: object
      properties:
        textHash: { type: string }
        text: { type: string }
        score: { type: number }
    TriggerInstruction:
      type: object
      properties:
        instructionId: { type: string }
        ruleId: { type: string }
        action: { type: string, enum: [uiHint, live2DSignal, replayMarker, reviewReport] }
        eventIds:
          type: array
          items: { type: string }
        priority: { type: integer }
        createdAt: { type: string, format: date-time }
    LlmRequest:
      type: object
      required: [requestId, scene, eventType, variables, mode]
      properties:
        requestId: { type: string }
        scene: { type: string }
        eventType: { type: string }
        variables:
          type: object
          additionalProperties: { type: string }
        mode: { type: string, enum: [full, stream] }
    StructuredInsight:
      type: object
      properties:
        insightId: { type: string }
        eventType: { type: string }
        level: { type: string, enum: [info, hint, warning, critical] }
        title: { type: string }
        summary: { type: string }
        actions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    RoutedInsightPayload:
      type: object
      properties:
        channel: { type: string, enum: [uiRealtime, live2DSignal, replayLibrary, reviewReport, fallbackLog] }
        content: { type: object, additionalProperties: true }
    UserProfile:
      type: object
      properties:
        userId: { type: string }
        encryptedBasicAttributes: { type: string }
        behaviorTags:
          type: array
          items: { type: string }
        preferences:
          type: object
          additionalProperties: { type: string }
        capabilityBaseline:
          type: object
          additionalProperties: { type: number }
        trends:
          type: array
          items:
            type: object
            properties:
              metric: { type: string }
              value: { type: number }
              updatedAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        archived: { type: boolean }
    ReplayMarkerConfig:
      type: object
      properties:
        minIntervalSeconds: { type: integer }
        minEventWeight: { type: integer }
        minInsightLevel: { type: string, enum: [info, hint, warning, critical] }
    ReplayKeyframe:
      type: object
      properties:
        markerId: { type: string }
        timestamp: { type: string, format: date-time }
        markerType: { type: string }
        label: { type: string }
        context: { type: object, additionalProperties: true }
        manual: { type: boolean }
    Live2DSignal:
      type: object
      properties:
        signalId: { type: string }
        action: { type: string }
        priority: { type: integer }
        payload: { type: string }
        createdAt: { type: string, format: date-time }
    HeartbeatStatus:
      type: object
      properties:
        connected: { type: boolean }
        state: { type: string, enum: [idle, interacting, hinting, warning, disconnected] }
        queuedCount: { type: integer }
