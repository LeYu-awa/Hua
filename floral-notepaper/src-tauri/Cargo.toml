[package]
name = "floral-notepaper"
version = "1.0.4"
description = "A lightweight cross-platform desktop note app"
authors = ["Achilng"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "floral_notepaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-clipboard-manager = "2"
trash = "5"
reqwest = { version = "0.12", features = ["json"] }
# 向量检索：SQLite 扩展，嵌入现有 rusqlite（event_store 同库模式）
sqlite-vec = "0.1"
# MCP 工具协议化：官方 Rust SDK（模型上下文协议），stdio 服务器暴露 orchestrator 工具
rmcp = { version = "0.16", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync"] }
schemars = { version = "0.8", features = ["derive"] }

# macOS-only: used to toggle NSWindow.documentEdited (the unsaved dot in the red
# traffic-light button). Already present transitively via Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
serde_json = "1"
